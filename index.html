    <!--
      Liquid glass.

      `backdrop-filter` accepts `url()`, which means a surface can refract what
      is behind it rather than merely blurring it — the thing that separates
      Apple's Liquid Glass from a rounded rectangle with a blur on it.

      Each filter displaces the backdrop using a map whose red channel carries
      horizontal shift and whose green channel carries vertical, with mid-grey
      meaning "leave this pixel alone". The map is neutral across the middle and
      ramps at the edges, so the centre stays honest and the rim sweeps the
      background inward the way the thick edge of a real lens does.

      `primitiveUnits="objectBoundingBox"` is what lets one filter serve a
      52px button and a 900px sheet: every length becomes a fraction of the
      element, so the lens fits whatever it is applied to. The two maps differ
      only in how wide that edge band is — a large panel needs a proportionally
      narrower one, or the whole surface becomes edge.
    -->
    <svg class="fz-filter-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter id="fz-lens" x="0%" y="0%" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">

          <feDisplacementMap in="SourceGraphic" in2="map" scale="0.085" xChannelSelector="R" yChannelSelector="G" />
        </filter>
