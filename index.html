<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#0e0e0e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frequenzy" />
    <meta name="description" content="Frequenzy — a lossless network music player for Navidrome" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Frequenzy</title>
    <script>
      // Paint the boot screen in the finish the listener chose, before any CSS loads.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('frequenzy.settings.v1') || '{}');
          var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = t;
          if (s.accent) document.documentElement.dataset.accent = s.accent;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      #fz-boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #0e0e0e; font-family: ui-monospace, Menlo, monospace; }
      :root[data-theme='light'] #fz-boot { background: #e9e9e5; }
      .fz-boot-unit { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .fz-boot-key { width: 56px; height: 56px; border-radius: 15px; background: #ff4f00; display: grid; place-items: center; box-shadow: 0 3px 0 #a83400; }
      .fz-boot-key i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #0d0d0c; position: relative; animation: fz-boot-turn 1.2s cubic-bezier(.6,0,.4,1) infinite; }
      .fz-boot-key i::after { content: ''; position: absolute; left: 50%; top: 1px; width: 3px; height: 9px; margin-left: -1.5px; border-radius: 2px; background: #0d0d0c; }
      .fz-boot-name { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #8e8e88; }
      @keyframes fz-boot-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .fz-boot-key i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="fz-boot" aria-hidden="true">
      <div class="fz-boot-unit">
        <div class="fz-boot-key"><i></i></div>
        <div class="fz-boot-name">frequenzy · fz-1</div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
